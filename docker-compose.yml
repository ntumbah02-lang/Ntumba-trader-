version: "3.9"

services:
  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - APP_ENV=development
      - APP_NAME=NTUMBA TRADER
      - DATABASE_URL=sqlite:///./ntumba_trader.db
      - SECRET_KEY=ntumba-trader-secret-change-me
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

  bot:
    build: ./bot
    command: python main.py
    volumes:
      - ./bot:/app
    environment:
      - APP_ENV=development

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ntumba_trader
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: trader123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
